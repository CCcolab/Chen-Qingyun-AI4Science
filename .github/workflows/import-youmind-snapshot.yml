name: Import verified YouMind snapshot (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youmind-initial-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Unpack the reviewed public website snapshot
        env:
          CHEN_SNAPSHOT_000: 
          CHEN_SNAPSHOT_001: 
          CHEN_SNAPSHOT_002: 
          CHEN_SNAPSHOT_003: 
          CHEN_SNAPSHOT_004: 
          CHEN_SNAPSHOT_005: 
          CHEN_SNAPSHOT_006: 
          CHEN_SNAPSHOT_007: 
          CHEN_SNAPSHOT_008: 
          CHEN_SNAPSHOT_009: 
          CHEN_SNAPSHOT_010: 
          CHEN_SNAPSHOT_011: 
          CHEN_SNAPSHOT_012: 
          CHEN_SNAPSHOT_013: 
          CHEN_SNAPSHOT_014: 
          CHEN_SNAPSHOT_015: 
          CHEN_SNAPSHOT_016: 
          CHEN_SNAPSHOT_017: 
          CHEN_SNAPSHOT_018: 
          CHEN_SNAPSHOT_019: 
          CHEN_SNAPSHOT_020: 
        shell: python
        run: |
          import base64, hashlib, io, os, pathlib, zipfile
          payload = ''.join(os.environ[f'CHEN_SNAPSHOT_{i:03d}'] for i in range(21))
          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == "08ea80b13ecdc9116ae7860e9de16f4c846020f17a078c5aae3f090870b371bf", "Snapshot checksum mismatch"
          root = pathlib.Path.cwd()
          assert not (root / "site/index.html").exists(), "Site already imported; refusing to overwrite"
          expected = ['.gitattributes', '.gitignore', 'NOTICE.md', 'README.md', 'audit/javascript-report.json', 'audit/site-manifest.json', 'audit/validation-report.json', 'docs/MIGRATION_zh-CN.md', 'docs/WSL2_ACCEPTANCE_zh-CN.md', 'docs/YOUMIND_HANDOFF_zh-CN.md', 'site/.nojekyll', 'site/achievements/index.html', 'site/data/achievement-lines.json', 'site/data/public-sources.json', 'site/index.html', 'site/pftb/index.html', 'site/topics/chen-reagent/index.html', 'site/topics/deoxyfluorination/index.html', 'site/topics/early-fluoroketones/index.html', 'site/topics/f53/index.html', 'site/topics/fluorinated-small-rings/index.html', 'site/topics/fluoromonomers/index.html', 'site/topics/fluoroporphyrins/index.html', 'site/topics/index.html', 'site/topics/perfluorosulfonates/index.html', 'site/topics/refrigerants/index.html', 'site/topics/single-electron-transfer/index.html', 'site/topics/sulfonyl-fluoride/index.html', 'tools/check_js.mjs', 'tools/check_site.py', 'tools/serve_site.py']
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert sorted(archive.namelist()) == sorted(expected), "Unexpected archive entries"
              assert sum(i.file_size for i in archive.infolist()) < 2000000, "Snapshot size exceeded"
              for name in expected:
                  parts = pathlib.PurePosixPath(name).parts
                  assert not name.startswith("/") and ".." not in parts and ".git" not in parts and ".github" not in parts
                  target = root.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          print("Imported 31 verified files")
      - name: Verify files and project paths
        run: python3 tools/check_site.py --http
      - name: Parse JavaScript without executing it
        run: node tools/check_js.mjs
      - name: Commit imported source to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site audit tools docs README.md NOTICE.md .gitattributes .gitignore
          git diff --cached --stat
          git commit -m "Import verified YouMind website and migration checks"
          git push origin HEAD:main
